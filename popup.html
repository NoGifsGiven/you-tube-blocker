<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 350px;
      max-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px;
      color: #1a1a1a;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .section {
      margin-bottom: 12px;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .count {
      font-weight: normal;
      color: #666;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 160px;
      overflow-y: auto;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }
    li:last-child {
      border-bottom: none;
    }
    .item-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      margin-right: 8px;
    }
    button.remove {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      padding: 2px 8px;
      font-size: 12px;
      color: #c00;
      flex-shrink: 0;
    }
    button.remove:hover {
      background: #fdd;
    }
    button.clear-all {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #c00;
      padding: 0;
    }
    button.clear-all:hover {
      text-decoration: underline;
    }
    .empty {
      color: #999;
      font-style: italic;
    }
    .io-section {
      border-top: 1px solid #eee;
      padding-top: 10px;
      margin-top: 4px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button.io {
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      padding: 4px 10px;
      font-size: 12px;
      color: #1a1a1a;
    }
    button.io:hover {
      background: #e8e8e8;
    }
    .status {
      flex: 1;
      font-size: 12px;
      color: #555;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status.error {
      color: #c00;
    }
  </style>
</head>
<body>
  <h2>YouTube Video Blocker</h2>

  <div class="section">
    <div class="section-title">
      Blocked Videos <span class="count" id="video-count"></span>
      <button class="clear-all" id="clear-videos">Clear all</button>
    </div>
    <ul id="video-list"></ul>
  </div>

  <div class="section">
    <div class="section-title">
      Blocked Channels <span class="count" id="channel-count"></span>
      <button class="clear-all" id="clear-channels">Clear all</button>
    </div>
    <ul id="channel-list"></ul>
  </div>

  <div class="section">
    <div class="section-title">
      Blocked Collab Pairs <span class="count" id="pair-count"></span>
      <button class="clear-all" id="clear-pairs">Clear all</button>
    </div>
    <ul id="pair-list"></ul>
  </div>

  <div class="io-section">
    <button class="io" id="export-btn">Export…</button>
    <button class="io" id="import-btn">Import…</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <span class="status" id="io-status"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
